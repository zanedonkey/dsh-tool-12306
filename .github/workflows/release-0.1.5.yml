name: Publish authorized GitHub release v0.1.5

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-0.1.5.yml]

permissions:
  contents: read

concurrency:
  group: github-release-v0.1.5
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 25409dccf62be35b295d21a0707fed3cca381f46
      PACKAGE: dsh-tool-12306-0.1.5.tgz
      EXPECTED_SHA256: 4cbae16254c7b3723723d676ed15ab6da256ecd7a0bd420dba508cb7439facbf
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify published npm artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "zanedonkey/dsh-tool-12306"
          test "$(git rev-parse HEAD:docs/RELEASE_NOTES_0.1.5.md)" = "$(git rev-parse "$SOURCE_SHA:docs/RELEASE_NOTES_0.1.5.md")"
          curl --fail --location --retry 3 --output "$PACKAGE" "https://registry.npmjs.org/dsh-tool-12306/-/$PACKAGE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$PACKAGE" > "$PACKAGE.sha256"
          sha256sum --check "$PACKAGE.sha256"
          test "$(stat --format=%s "$PACKAGE")" = "58875"
          mkdir inspection
          tar -xzf "$PACKAGE" -C inspection
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const p=JSON.parse(fs.readFileSync('inspection/package/package.json','utf8')); assert.equal(p.name,'dsh-tool-12306'); assert.equal(p.version,'0.1.5'); for(const f of ['dist/index.js','dist/index.d.ts','dist/transfer-pricing.js','docs/TRANSFER_PRICING.md','LICENSE','THIRD_PARTY_NOTICES.md']) assert(fs.existsSync('inspection/package/'+f),f);"
      - name: Create draft and upload verified assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.5 > /dev/null 2>&1; then
            printf 'Release v0.1.5 already exists; refusing to overwrite.\n' >&2
            exit 1
          fi
          gh release create v0.1.5 --target "$SOURCE_SHA" --draft --title 'v0.1.5 — Transfer seat combinations and pricing' --notes-file docs/RELEASE_NOTES_0.1.5.md
          gh release upload v0.1.5 "$PACKAGE" "$PACKAGE.sha256"
          mkdir verification
          gh release download v0.1.5 --dir verification --pattern "$PACKAGE" --pattern "$PACKAGE.sha256"
          cmp "$PACKAGE" "verification/$PACKAGE"
          cmp "$PACKAGE.sha256" "verification/$PACKAGE.sha256"
          (cd verification && sha256sum --check "$PACKAGE.sha256")
      - name: Publish verified release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.1.5 --draft=false --latest
          gh release view v0.1.5 --json url,isDraft,isPrerelease,tagName,assets
